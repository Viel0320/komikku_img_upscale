name: Viel Builder
# Build the fork-only `viel` variant (same as `preview`, own application id) and publish it
# to the releases of the repository this workflow runs in.
#
# The in-app updater and changelog of `viel` builds read from `VIEL_REPO`
# (app/src/main/java/eu/kanade/tachiyomi/data/updater/AppUpdateChecker.kt), so keep that
# constant in sync with the repository below.

on:
  # Manual trigger only, run it from `master`.
  workflow_dispatch:
    inputs:
      # GitHub renders dispatch string inputs as single-line fields, so new lines have to be
      # written as literal `\n` and are expanded below.
      changelog:
        description: 'Release notes in Markdown (write \n for line breaks). Leave empty for none.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-build:
    name: Prepare build
    runs-on: 'ubuntu-24.04'
    outputs:
      VERSION_TAG: ${{ steps.get_tag.outputs.VERSION_TAG }}
      TAG_NAME: ${{ steps.prepare_env.outputs.TAG_NAME }}
      CURRENT_SHA: ${{ steps.current_commit.outputs.CURRENT_SHA }}
      PREV_REF: ${{ steps.previous_release.outputs.PREV_REF }}
    steps:
      - name: Get tag name (${{ github.ref }})
        id: get_tag
        run: |
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Current commit
        id: current_commit
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> "$GITHUB_OUTPUT"
          echo "CURRENT_SHA=$current_sha"
          echo "CURRENT_SHA=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare env
        id: prepare_env
        run: |
          # Release tags of `viel` builds are `r<commit count>`, matching `getReleaseTag()`
          # in AppUpdateChecker.kt.
          echo "TAG_NAME=r${{ steps.current_commit.outputs.COMMIT_COUNT }}"
          echo "TAG_NAME=r${{ steps.current_commit.outputs.COMMIT_COUNT }}" >> "$GITHUB_OUTPUT"

      - name: Get previous release ref
        id: previous_release
        run: |
          # Only used for the "Full Changelog" compare link, the release notes themselves are
          # written by hand. Comparing against the tag directly (instead of a commit derived
          # from `HEAD~<count>`) keeps the range correct on merge commits.
          prev_ref=$(curl -fsSL \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r '[.[] | select(.draft == false) | .tag_name] | first // empty')

          if [ -z "${prev_ref}" ] || ! git rev-parse -q --verify "refs/tags/${prev_ref}" >/dev/null; then
            # No previous release to compare against, fall back to the initial commit.
            prev_ref=$(git rev-list --max-parents=0 HEAD | tail -n1)
          fi

          echo "Comparing ${prev_ref}..HEAD"
          echo "PREV_REF=${prev_ref}" >> "$GITHUB_OUTPUT"

      - name: Create tag '${{ steps.prepare_env.outputs.TAG_NAME }}'
        if: github.ref == 'refs/heads/master'
        run: |
          tag="${{ steps.prepare_env.outputs.TAG_NAME }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag '${tag}' already exists, reusing it."
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "New tag created: ${tag}"
          fi

  build-app:
    name: Build viel app
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    if: github.ref == 'refs/heads/master'
    env:
      HAS_CLIENT_SECRETS: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON != '' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write client_secrets.json
        if: env.HAS_CLIENT_SECRETS == 'true'
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build viel app
        # `enable-updater` is required, otherwise the in-app update check is compiled out.
        run: ./gradlew assembleViel -Penable-updater

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

  release-app:
    name: Publish viel release
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app
    env:
      # Optionally sign with the same keystore as upstream CI. Without the secrets the
      # debug-signed APK produced by the `viel` build type is published as-is.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign APKs
        if: env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/viel
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Warn about unsigned build
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::SIGNING_KEY is not configured, the release will contain a debug-signed APK. Set SIGNING_KEY / ALIAS / KEY_STORE_PASSWORD / KEY_PASSWORD to keep updates installable over previous releases."

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail

          tag='${{ needs.prepare-build.outputs.TAG_NAME }}'
          apk_dir='app/build/outputs/apk/viel'

          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            src=''
            for candidate in "${apk_dir}/app-${abi}-viel-signed.apk" "${apk_dir}/app-${abi}-viel.apk"; do
              if [ -f "${candidate}" ]; then
                src="${candidate}"
                break
              fi
            done

            if [ -z "${src}" ]; then
              echo "::error::Missing APK for '${abi}' in ${apk_dir}"
              ls -la "${apk_dir}" || true
              exit 1
            fi

            if [ "${abi}" = 'universal' ]; then
              mv "${src}" "Komikku-Viel-${tag}.apk"
            else
              mv "${src}" "Komikku-Viel-${abi}-${tag}.apk"
            fi
          done

          ls -la ./*.apk

      - name: Build release notes
        id: changelog
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          {
            echo "CHANGELOG<<{delimiter}"
            printf '%b\n' "${CHANGELOG_INPUT}"
            echo "{delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare-build.outputs.TAG_NAME }}
          name: Komikku Viel ${{ needs.prepare-build.outputs.TAG_NAME }} (${{ needs.prepare-build.outputs.VERSION_TAG }})
          # The changelog is whatever was entered in the dispatch input, so leaving it empty
          # results in an empty "What's Changed" section.
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${{ needs.prepare-build.outputs.TAG_NAME }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/${{ github.repository }}/releases/${{ needs.prepare-build.outputs.TAG_NAME }})
            #### What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            **Full Changelog**: [${{ github.repository }}@${{ needs.prepare-build.outputs.PREV_REF }}...${{ needs.prepare-build.outputs.TAG_NAME }}](https://github.com/${{ github.repository }}/compare/${{ needs.prepare-build.outputs.PREV_REF }}...${{ needs.prepare-build.outputs.CURRENT_SHA }})

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `Komikku-Viel-${{ needs.prepare-build.outputs.TAG_NAME }}.apk`
          files: |
            Komikku-Viel-*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
